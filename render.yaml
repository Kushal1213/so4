# Render Blueprint - deploy backend + frontend with one click
# Dashboard -> New -> Blueprint -> connect this repo
services:
  - type: web
    name: sleep-oracle-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python retrain_model.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --chdir app app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: sleep-oracle-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
