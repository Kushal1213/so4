services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sleep-oracle-backend
    ports:
      - "5000:5000"
    environment:
      FRONTEND_URL: http://localhost:4173,http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: sleep-oracle-frontend
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
